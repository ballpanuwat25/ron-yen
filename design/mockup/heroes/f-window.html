<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ron Yen — F, the window</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@300;500&family=Noto+Serif+Display:wght@200;300&family=Instrument+Sans:wght@400;500&display=swap">
<style>
  :root {
    --ember: #ff5a1f;
    --cream: #f7ece2;
    --cream-soft: rgba(247, 236, 226, .72);
    --line: rgba(247, 236, 226, .34);
    --ice: #bfe0f2;
    --gutter: clamp(16px, 2.6vw, 40px);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #170905; color: var(--cream); }
  body { font: 400 14px/1.5 'Instrument Sans', system-ui, sans-serif; }

  .hero { position: relative; height: 100svh; min-height: 640px; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; }

  /* the sauna, printed in one hot ink */
  .base { position: absolute; inset: 0; z-index: 0; }
  .base img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.18) brightness(.95); }
  .base::after { content: ''; position: absolute; inset: 0; background: var(--ember); mix-blend-mode: multiply; }
  .vignette { position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(0deg, rgba(23, 9, 5, .7) 0%, rgba(23, 9, 5, 0) 36%), linear-gradient(180deg, rgba(23, 9, 5, .45) 0%, rgba(23, 9, 5, 0) 18%); }
  header, .grid, .foot { position: relative; z-index: 2; }
  .steam { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; }

  header { display: flex; align-items: center; gap: 28px; padding: 18px var(--gutter); border-bottom: 1px solid var(--line); }
  .mark { display: flex; align-items: baseline; gap: 12px; margin-right: auto; }
  .mark b { font: 500 24px/1 'Noto Serif Thai', serif; }
  .mark b i { font-style: normal; display: inline-block; width: .5em; text-align: center; opacity: .6; }
  .mark small { font-size: 12px; color: var(--cream-soft); }
  header nav { display: flex; gap: 26px; }
  header a { color: inherit; text-decoration: none; }
  header .book { background: var(--cream); color: #2a1008; padding: 9px 16px; font-weight: 500; }

  .grid { display: grid; grid-template-columns: minmax(300px, 1fr) 2fr; min-height: 0; }
  .cell { padding: 22px var(--gutter); min-height: 0; }
  .info { display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--line); }
  .kicker { font-size: 12px; letter-spacing: .04em; color: var(--cream-soft); }

  .today { list-style: none; padding: 0; margin-top: 10px; }
  .today li { display: grid; grid-template-columns: 52px 1fr; gap: 2px 12px; padding: 9px 0; border-top: 1px solid var(--line); }
  .today time { grid-row: span 2; font: 300 18px/1.2 'Noto Serif Display', serif; font-variant-numeric: tabular-nums; }
  .today .seats { display: flex; gap: 2px; align-items: center; height: 14px; }
  .today .seats svg { width: 8px; height: 11px; }
  .today .left { font-size: 12px; color: var(--cream-soft); }

  .reading .num { font: 200 clamp(110px, 11vw, 176px)/.8 'Noto Serif Display', serif; letter-spacing: -.04em;
    font-variant-numeric: tabular-nums; display: flex; align-items: flex-start; transition: color .5s; }
  .reading .num sup { font-size: .3em; line-height: 1; margin: .14em 0 0 .04em; font-weight: 300; }
  .reading .where { margin-top: 14px; font: 300 19px/1.35 'Noto Serif Thai', serif; }
  .reading.cold .num { color: var(--ice); }

  /* the window: one wide pane of fogged glass, the only cold place on the page */
  .view { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 30px clamp(24px, 4vw, 64px); }
  .pane { position: relative; width: 100%; max-width: 820px; aspect-ratio: 16 / 10; max-height: 100%; border-radius: 18px; overflow: hidden;
    outline: 1px solid var(--line); outline-offset: 8px; cursor: crosshair; touch-action: none; background: #0e1820; }
  .pane .coldprint, .pane canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* outside, the ice bath printed in the cold ink, the same way the sauna is printed in the hot one */
  .coldprint img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.15) brightness(1.2); }
  .coldprint::after { content: ''; position: absolute; inset: 0; background: #86bde4; mix-blend-mode: multiply; }
  .view .say { font-size: 12px; color: var(--cream-soft); letter-spacing: .04em; min-height: 1.5em; transition: opacity .4s; }

  .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 22px var(--gutter) 26px; border-top: 1px solid var(--line); }
  .foot h1 { font: 300 clamp(40px, 5.4vw, 84px)/.98 'Noto Serif Display', serif; letter-spacing: -.02em; }
  .foot h1 em { font-style: normal; color: var(--ice); }
  .foot p { max-width: 22em; color: var(--cream-soft); }


  @media (max-width: 860px) {
    header nav { display: none; }
    .mark small { display: none; }
    .hero { height: auto; min-height: 100svh; }
    .grid { grid-template-columns: 1fr; }
    .view { order: -1; border-bottom: 1px solid var(--line); padding: 28px var(--gutter) 18px; }
    .pane { aspect-ratio: 4 / 3; }
    .info { border-right: 0; gap: 32px; flex-direction: column-reverse; }   /* the reading right under the window */
    .reading .num { font-size: 104px; }
    .foot { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<section class="hero" id="hero">
  <div class="base"><img id="baseImg" alt=""></div>
  <div class="vignette"></div>
  <canvas class="steam" id="steam"></canvas>

  <header>
    <div class="mark"><b>ร้อน<i>·</i>เย็น</b><small>Ron Yen · hot, cold</small></div>
    <nav><a href="#">A round</a><a href="#">The rooms</a><a href="#">Packs</a><a href="#">Find us</a></nav>
    <a class="book" href="#">Book a session</a>
  </header>

  <div class="grid">
    <div class="cell info">
      <div>
        <span class="kicker">Today, Tue 20 Oct</span>
        <ul class="today" id="today"></ul>
      </div>
      <div class="reading" id="reading">
        <div class="num"><span id="deg">88</span><sup>°C</sup></div>
        <div class="where" id="where">On the bench, ten at a time</div>
      </div>
    </div>

    <div class="cell view">
      <div class="pane" id="pane">
        <div class="coldprint"><img id="coldImg" src="../img/window-floes.webp" alt="The ice bath, outside the sauna window"></div>
        <canvas id="fog"></canvas>
      </div>
      <span class="say" id="say">Wipe the glass</span>
    </div>
  </div>

  <div class="foot">
    <h1>Sweat at 88°.<br><em>Then the ice.</em></h1>
    <p>Seventy-five minutes, as many rounds as you like. Two minutes from BTS Ari, open from 06:30.</p>
  </div>
</section>

<script type="module">
import { loadImage, photo, smooth } from './gl.js';

const DROP = 'M9 1 C9 1 2 10 2 15.2 A7 7 0 0 0 16 15.2 C16 10 9 1 9 1 Z';
const hero = document.getElementById('hero'), pane = document.getElementById('pane');

// ---------- today's next sessions ----------
document.getElementById('today').innerHTML = [['17:00', 10], ['18:30', 9], ['20:00', null]].map(([time, taken]) => {
  const seats = taken === null ? '' : Array.from({ length: 10 }, (_, i) =>
    `<svg viewBox="0 0 18 24" aria-hidden="true"><path d="${DROP}" fill="${i < taken ? 'rgba(247,236,226,.85)' : 'none'}" stroke="rgba(247,236,226,.6)" stroke-width="1.6"/></svg>`).join('');
  const left = taken === null ? 'Private, up to six' : taken === 10 ? 'Full, join the waitlist' : `${10 - taken} of 10 left`;
  return `<li><time>${time}</time><span class="seats">${seats}</span><span class="left">${left}</span></li>`;
}).join('');

// ---------- photos ----------
const hotSrc = photo('hero-hot');
document.getElementById('baseImg').src = hotSrc;
const hotImg = await loadImage(hotSrc);

// ---------- the fogged pane ----------
// The fog is the sauna seen through wet glass: the slice of the photo behind the pane, blurred,
// in the same ember print, with beads of condensation. Wipe it and the ice bath is outside.
const cv = document.getElementById('fog'), cx = cv.getContext('2d');
const degEl = document.getElementById('deg'), whereEl = document.getElementById('where'), sayEl = document.getElementById('say');
const readingEl = document.getElementById('reading');
const coarse = matchMedia('(pointer: coarse)').matches;
if (coarse) sayEl.textContent = 'Wipe the glass with a finger';

const HOLD = 4000, REFOG = 5000, CELL = 3;
// each cell of the mask remembers how clear it was wiped and when; its clearness is worked out from
// those two, so the fog eases back in one smooth curve and a new wipe never leaves a hard seam
let W, H, DPR, fogTex, MW, MH, peak, wipedAt, clear, maskCv, mctx, maskImg;
const trails = [];
let nextDrip = performance.now() + 5000;

function build() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = pane.clientWidth; H = pane.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  fogTex = document.createElement('canvas'); fogTex.width = cv.width; fogTex.height = cv.height;
  const f = fogTex.getContext('2d');
  const hr = hero.getBoundingClientRect(), pr = pane.getBoundingClientRect();
  const s = Math.max(hr.width / hotImg.width, hr.height / hotImg.height);
  const ox = (hr.width - hotImg.width * s) / 2 - (pr.left - hr.left), oy = (hr.height - hotImg.height * s) / 2 - (pr.top - hr.top);
  f.fillStyle = '#b8461c'; f.fillRect(0, 0, fogTex.width, fogTex.height);
  f.filter = `grayscale(1) contrast(1.35) brightness(.85) blur(${10 * DPR}px)`;
  f.drawImage(hotImg, ox * DPR, oy * DPR, hotImg.width * s * DPR, hotImg.height * s * DPR);
  f.filter = 'none';
  f.globalCompositeOperation = 'multiply'; f.fillStyle = '#ff6a2a'; f.fillRect(0, 0, fogTex.width, fogTex.height);
  f.globalCompositeOperation = 'source-over'; f.fillStyle = 'rgba(255, 196, 160, .22)'; f.fillRect(0, 0, fogTex.width, fogTex.height);
  const sheen = f.createLinearGradient(0, 0, fogTex.width * .6, fogTex.height);
  sheen.addColorStop(0, 'rgba(255,236,220,.2)'); sheen.addColorStop(.4, 'rgba(255,236,220,0)');
  f.fillStyle = sheen; f.fillRect(0, 0, fogTex.width, fogTex.height);
  const beads = Math.round(W * H / 140);
  for (let i = 0; i < beads; i++) {
    const x = Math.random() * fogTex.width, y = Math.random() * fogTex.height;
    const r = (Math.random() ** 3 * 3 + .5) * DPR;
    const g = f.createRadialGradient(x - r * .3, y - r * .3, 0, x, y, r);
    g.addColorStop(0, 'rgba(255,244,232,.6)'); g.addColorStop(.7, 'rgba(255,230,210,.14)'); g.addColorStop(1, 'rgba(70,20,8,.28)');
    f.fillStyle = g; f.beginPath(); f.arc(x, y, r, 0, 7); f.fill();
  }
  MW = Math.ceil(W / CELL); MH = Math.ceil(H / CELL);
  peak = new Float32Array(MW * MH); wipedAt = new Float32Array(MW * MH).fill(-1e9); clear = new Float32Array(MW * MH);
  maskCv = document.createElement('canvas'); maskCv.width = MW; maskCv.height = MH;
  mctx = maskCv.getContext('2d'); maskImg = mctx.createImageData(MW, MH);
  trails.length = 0;
}

const clearAt = (i, now) => peak[i] * (1 - smooth(HOLD, HOLD + REFOG, now - wipedAt[i]));

let last = null, lastInput = -1e9;
function stamp(px, py, now) {
  const r = (coarse ? 36 : 46) / CELL;
  const cx0 = px / CELL, cy0 = py / CELL;
  const x0 = Math.max(0, Math.floor(cx0 - r)), x1 = Math.min(MW - 1, Math.ceil(cx0 + r));
  const y0 = Math.max(0, Math.floor(cy0 - r)), y1 = Math.min(MH - 1, Math.ceil(cy0 + r));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const d = Math.hypot(x - cx0, y - cy0) / r;
    if (d >= 1) continue;
    const k = 1 - smooth(.55, 1, d), i = y * MW + x;
    // only where this wipe makes the glass clearer than it is now does the cell start over
    if (k > clearAt(i, now)) { peak[i] = k; wipedAt[i] = now; }
  }
}
function wipeTo(x, y) {
  const now = performance.now();
  const from = last || { x, y };
  const steps = Math.max(1, Math.ceil(Math.hypot(x - from.x, y - from.y) / 4));
  for (let i = 1; i <= steps; i++) {
    const px = from.x + (x - from.x) * i / steps, py = from.y + (y - from.y) * i / steps;
    stamp(px, py, now);
    if (Math.random() < .008) trails.push({ pts: [[px + (Math.random() - .5) * 40, py + 30]], v: .5 + Math.random() * .8, w: 1.6 + Math.random() * 1.2, born: now, fade: 1, seed: Math.random() * 9 });
  }
  last = { x, y }; lastInput = now;
}
const local = e => { const r = pane.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
pane.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) wipeTo(...local(e)); });
pane.addEventListener('pointerdown', e => { last = null; pane.setPointerCapture(e.pointerId); wipeTo(...local(e)); });
pane.addEventListener('pointerleave', () => { last = null; });
pane.addEventListener('pointerup', () => { last = null; });

function demoWipe() {
  const pts = [];
  for (let i = 0; i <= 40; i++) { const k = i / 40; pts.push([W * (.18 + k * .64), H * .5 + Math.sin(k * Math.PI * 2) * H * .1]); }
  let i = 0; last = null;
  const id = setInterval(() => { if (i >= pts.length) { clearInterval(id); last = null; return; } wipeTo(...pts[i++]); }, 22);
}

let shown = 88, prev = performance.now();
function frame(now) {
  const dt = Math.min(50, now - prev); prev = now;
  let sum = 0;
  const px = maskImg.data;
  for (let i = 0; i < clear.length; i++) {
    const c = clear[i] = clearAt(i, now);
    sum += c; px[i * 4 + 3] = c * 255;
  }
  mctx.putImageData(maskImg, 0, 0);
  cx.globalCompositeOperation = 'source-over';
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.drawImage(fogTex, 0, 0);
  cx.globalCompositeOperation = 'destination-out';
  cx.imageSmoothingQuality = 'high';
  cx.filter = `blur(${3 * DPR}px)`;
  cx.drawImage(maskCv, 0, 0, MW * CELL * DPR, MH * CELL * DPR);
  cx.filter = 'none';
  cx.lineCap = 'round';
  // left alone, condensation gathers and now and then a drop runs down the glass on its own,
  // leaving a thin clear line to the ice outside
  if (now > nextDrip) {
    trails.push({ pts: [[W * (.08 + Math.random() * .84), H * (.04 + Math.random() * .3)]], v: .8 + Math.random() * .8,
      w: 2.2 + Math.random() * 1.6, slow: .9975, born: now, fade: 1, seed: Math.random() * 9 });
    nextDrip = now + 8000 + Math.random() * 4000;
  }
  for (let i = trails.length - 1; i >= 0; i--) {
    const tr = trails[i];
    const moving = tr.v > .06;
    if (moving) {
      const [lx, ly] = tr.pts[tr.pts.length - 1];
      // water runs straight down; it only kinks a pixel or so around its line, never drifts off it
      const ny = ly + tr.v * dt * .06;
      const x0 = tr.pts[0][0];
      const nx = x0 + Math.sin(ny * .09 + tr.seed) * .7 + Math.sin(ny * .23 + tr.seed * 3) * .35;
      tr.pts.push([nx, ny]); tr.v *= tr.slow || .99;
      tr.born = now;                              // the clear line starts to fog over once the drop stops
    }
    if (now - tr.born > HOLD) tr.fade -= dt / REFOG;
    if (tr.fade <= 0 || tr.pts[tr.pts.length - 1][1] > H + 10) { trails.splice(i, 1); continue; }
    // a drip is just glass the water has washed clear: a soft line, thin where it started and
    // fuller toward where the water still is, with no outline of its own
    const n = tr.pts.length, step = Math.max(1, Math.floor(n / 24));
    cx.strokeStyle = `rgba(0,0,0,${.6 * tr.fade})`;
    cx.filter = `blur(${.6 * DPR}px)`;
    for (let j = step; j < n; j += step) {
      const a0 = tr.pts[j - step], a1 = tr.pts[Math.min(n - 1, j)];
      cx.lineWidth = tr.w * (.3 + .6 * (j / n)) * DPR;
      cx.beginPath(); cx.moveTo(a0[0] * DPR, a0[1] * DPR); cx.lineTo(a1[0] * DPR, a1[1] * DPR); cx.stroke();
    }
    // the water still gathered at the bottom: a slightly wider, softer patch of clear glass
    const [hx, hy] = tr.pts[n - 1];
    cx.filter = `blur(${1.2 * DPR}px)`;
    cx.fillStyle = `rgba(0,0,0,${.75 * tr.fade})`;
    cx.beginPath(); cx.ellipse(hx * DPR, (hy - tr.w * .6) * DPR, tr.w * .8 * DPR, tr.w * 1.5 * DPR, 0, 0, 7); cx.fill();
    cx.filter = 'none';
  }

  // one reading: how much ice shows through the window takes it from the bench toward the bath
  const k = smooth(.03, .4, sum / clear.length);
  shown += (88 - 85 * k - shown) * (1 - Math.exp(-dt / 260));
  degEl.textContent = Math.round(shown);
  readingEl.classList.toggle('cold', shown < 45);
  whereEl.textContent = shown > 60 ? 'On the bench, ten at a time' : shown > 20 ? 'Out of the heat' : 'In the ice bath, one at a time';
  sayEl.style.opacity = k > .05 ? 0 : 1;
  requestAnimationFrame(frame);
}

// ---------- steam that follows the pointer around the sauna, and stays off the glass ----------
// Like the lantern light in Saeng House, it trails the pointer; over the window it stops and thins
// out, because there the pointer is wiping instead.
const scv = document.getElementById('steam'), sx = scv.getContext('2d');
const puff = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, 'rgba(255,236,220,.5)'); r.addColorStop(.45, 'rgba(255,226,205,.2)'); r.addColorStop(1, 'rgba(255,226,205,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  return c;
})();
const puffs = [];
const ptr = { x: -1e4, y: -1e4, vx: 0, vy: 0, inside: false, onPane: false, at: -1e9 };
function sizeSteam() { scv.width = hero.clientWidth * DPR; scv.height = hero.clientHeight * DPR; }
hero.addEventListener('pointermove', e => {
  const r = hero.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (ptr.inside) { ptr.vx = x - ptr.x; ptr.vy = y - ptr.y; }
  ptr.x = x; ptr.y = y; ptr.inside = true; ptr.at = performance.now();
  const pr = pane.getBoundingClientRect();
  ptr.onPane = e.clientX > pr.left - 8 && e.clientX < pr.right + 8 && e.clientY > pr.top - 8 && e.clientY < pr.bottom + 8;
});
hero.addEventListener('pointerleave', () => { ptr.inside = false; });
function stepSteam(now, dt) {
  // a puff now and then while the pointer rests, more as it moves
  const speed = Math.hypot(ptr.vx, ptr.vy);
  if (ptr.inside && !ptr.onPane && now - ptr.at < 2500 && Math.random() < .12 + Math.min(.35, speed / 50)) {
    puffs.push({ x: ptr.x + (Math.random() - .5) * 14, y: ptr.y + (Math.random() - .5) * 14,
      vx: ptr.vx * .03 + (Math.random() - .5) * .4, vy: -(.35 + Math.random() * .45),
      r: 26 + Math.random() * 30, grow: .7 + Math.random() * .6, life: 0, max: 1700 + Math.random() * 900, seed: Math.random() * 99 });
  }
  // and always a little steam rising off the stones at the foot of the page, pointer or not
  if (Math.random() < .07) {
    const w = scv.width / DPR, h = scv.height / DPR;
    puffs.push({ x: w * Math.random(), y: h + 30, vx: (Math.random() - .5) * .15, vy: -(.3 + Math.random() * .3),
      r: 60 + Math.random() * 70, grow: .25 + Math.random() * .25, life: 0, max: 4200 + Math.random() * 2400, seed: Math.random() * 99, ambient: true });
  }
  ptr.vx *= .8; ptr.vy *= .8;
  sx.setTransform(DPR, 0, 0, DPR, 0, 0);
  sx.clearRect(0, 0, scv.width, scv.height);
  sx.globalCompositeOperation = 'screen';
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i];
    // over the glass the steam thins out fast
    p.life += dt * (ptr.onPane && !p.ambient ? 3 : 1);
    p.vx += Math.sin(now / 900 + p.seed) * .006;
    p.vx *= .985; p.vy = p.vy * .99 - .004;
    p.x += p.vx * dt * .06; p.y += p.vy * dt * .06; p.r += p.grow * dt * .06;
    const k = p.life / p.max;
    if (k >= 1) { puffs.splice(i, 1); continue; }
    sx.globalAlpha = Math.sin(Math.min(1, k * 1.6) * Math.PI / 2) * (1 - k) * (p.ambient ? .22 : .38);
    sx.drawImage(puff, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
  }
  // and a soft warm light right at the pointer, as in Saeng House
  if (ptr.inside && !ptr.onPane) {
    const g = sx.createRadialGradient(ptr.x, ptr.y, 0, ptr.x, ptr.y, 180);
    g.addColorStop(0, 'rgba(255,190,140,.16)'); g.addColorStop(1, 'rgba(255,190,140,0)');
    sx.globalAlpha = 1; sx.fillStyle = g; sx.fillRect(ptr.x - 180, ptr.y - 180, 360, 360);
  }
  sx.globalAlpha = 1;
}
(function steamLoop(prevT) {
  requestAnimationFrame(now => { stepSteam(now, Math.min(50, now - prevT)); steamLoop(now); });
})(performance.now());

addEventListener('resize', () => { build(); sizeSteam(); });
build();
sizeSteam();
requestAnimationFrame(frame);
setTimeout(() => { if (performance.now() - lastInput > 1500) demoWipe(); }, 1200);
</script>
</body>
</html>
